# Temporary fork-only diagnostics; never merge.
name: Diagnose Public API Access (fork only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: '10'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
    - name: Inspect public API response and DNS
      run: 'mkdir -p reports

        node scripts/diagnose-api-access.mjs | tee reports/access-diagnostics.json'
    - name: Preserve access diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: access-diagnostics-${{ github.run_id }}
        path: reports/access-diagnostics.json
        retention-days: '14'
        if-no-files-found: warn
